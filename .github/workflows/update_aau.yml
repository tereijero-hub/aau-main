name: 🛰️ EMPIRE-DISPLAY-DATA-WATCH

on:
  push:
    paths:
      - 'internal_core_data.json' # データが届いた時だけ反応
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 データ受信の確認
        uses: actions/checkout@v4

      - name: 🔍 データの健全性チェック
        run: |
          echo "📡 最新のインテリジェンス（JSON）を受信しました。"
          cat internal_core_data.json | jq .metadata
          echo "✅ ダッシュボード（Streamlit）への反映準備完了。"

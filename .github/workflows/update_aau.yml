name: EMPIRE-DISPLAY-AUTOMATION

on:
  push:
    branches: [ main ]
    paths:
      - 'internal_core_data.json' # データ着弾を監視
  workflow_dispatch: # 手動テスト用

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # サイト更新の書き込み権限
    steps:
      - name: 拠点資産の展開
        uses: actions/checkout@v3

      - name: 演算環境の構築
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🚀 表示更新の執行
        run: |
          python aau_dashboard.py

      - name: 📡 最新ダッシュボードの公開
        run: |
          git config user.name "Empire-Bot"
          git config user.email "bot@empire.com"
          git add index.html
          git commit -m "📦 Dashboard Update [skip ci]" || exit 0
          git push origin main

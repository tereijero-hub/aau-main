name: AAU v120.0 Core-Brain Operations

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'

jobs:
  brain-execution:
    runs-on: ubuntu-latest
    steps:
    - name: 帝国全兵装の展開
      uses: actions/checkout@v3

    - name: 演算環境の構築
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 依存ライブラリの換装
      run: pip install numpy && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 🚨 帝国演算の執行 (10体エージェント)
      run: |
        rm -f internal_core_data.json
        python aau_main.py 
      env:
        STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

    - name: 📡 司令室リポジトリへの強制転送 (物流プロトコル)
      run: |
        # 1. 通行証(EMPIRE_TOKEN)を使用して司令室リポジトリをクローン
        git clone https://x-access-token:${{ secrets.EMPIRE_TOKEN }}@github.com/tereijero-hub/-.git target_repo
        
        # 2. 演算結果を確実に配置
        cp internal_core_data.json target_repo/
        
        # 3. 司令室側でコミット＆プッシュを実行
        cd target_repo
        git config --local user.email "action@github.com"
        git config --local user.name "Empire-Bot"
        git add internal_core_data.json
        git commit -m "📦 Data Update from aau-main [skip ci]" || echo "No changes"
        
        # 4. 強制プッシュで歴史の衝突を回避
        git push origin main --force
      env:
        # ここでSecretに登録したトークンを使用
        GITHUB_TOKEN: ${{ secrets.EMPIRE_TOKEN }}

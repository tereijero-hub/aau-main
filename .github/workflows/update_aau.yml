name: AUTO-DISPLAY-SYNC

on:
  push:
    branches: [ main ]
    paths:
      - 'internal_core_data.json' # これが更新された時だけ動く

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 🚀 表示更新
        run: python aau_dashboard.py
        
      - name: 📡 GitHub Pagesへ反映
        run: |
          git config user.name "Empire-Bot"
          git config user.email "bot@empire.com"
          git add index.html
          git commit -m "📦 Display synchronized with core data [skip ci]" || echo "No changes"
          git push origin main

name: Imperial Strategic Engine

on:
  schedule:
    - cron: "0 * * * *"   # 1時間ごと
  workflow_dispatch:

jobs:
  run-engine:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Imperial Engine
      run: python aau_main.py

    - name: Commit Data
      run: |
        git config --global user.name "imperial-bot"
        git config --global user.email "bot@imperial.ai"
        git add internal_core_data.json
        git commit -m "update imperial simulation" || echo "no change"
        git push

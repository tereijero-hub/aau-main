name: EMPIRE-CORE-TOTAL-INTEGRATION

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  empire-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install pandas
          pip install matplotlib
          pip install yfinance
          pip install plotly
          pip install streamlit

      - name: 🚀 Run Empire Brain (真・結晶 v22.0)
        run: python aau_main.py

      - name: 📊 🚨 Summary出力プロトコル
        if: always()
        run: |
          # Pythonが生成したレポート(JOB_SUMMARY.md)をGitHubのシステムに直接注入
          if [ -f "JOB_SUMMARY.md" ]; then
            cat JOB_SUMMARY.md >> $GITHUB_STEP_SUMMARY
          else
            echo "# ⚠️ CRITICAL ERROR" >> $GITHUB_STEP_SUMMARY
            echo "司令官、レポートの生成自体に失敗しました。ログを確認してください。" >> $GITHUB_STEP_SUMMARY
          fi

name: Imperial Data Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Imperial Engine
        run: python aau_main.py

      - name: Commit updated data
        run: |
          git config --global user.name "imperial-bot"
          git config --global user.email "bot@imperial.local"
          git add internal_core_data.json
          git commit -m "Auto update simulation data" || echo "No changes"
          git push

name: EMPIRE-CORE-TOTAL-INTEGRATION

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  empire-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🛠️ Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Empire Brain
        run: python aau_main.py

      # 生成データをcommit
      - name: 📦 Commit Data
        run: |
          git config --global user.name "Empire-AI"
          git config --global user.email "empire@system.ai"

          git add internal_core_data.json

          git commit -m "Auto Update Imperial Data [skip ci]" || echo "No changes"

          git push

      - name: 📊 Summary出力プロトコル
        if: always()
        run: |
          if [ -f "JOB_SUMMARY.md" ]; then
            cat JOB_SUMMARY.md >> $GITHUB_STEP_SUMMARY
          else
            echo "# ⚠️ CRITICAL ERROR" >> $GITHUB_STEP_SUMMARY
            echo "司令官、レポートの生成自体に失敗しました。ログを確認してください。" >> $GITHUB_STEP_SUMMARY
          fi
